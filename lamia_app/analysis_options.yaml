# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Promote common bug categories to warnings (not errors, so the build
    # still passes) — these surface dead-code drift early, the way the
    # codebase already had `RecipeRepository.recipesByCategory` with zero
    # call sites and `meaning` no longer matching reality.
    unused_import: warning
    unused_local_variable: warning
    unused_element: warning
    missing_enum_constant_in_switch: warning
  language:
    # Enforce stricter type inference at compile time — recommended for
    # production apps. Catches implicit-dynamic that `RecipeModel.fromFirestore`
    # used to rely on.
    strict-casts: true
    strict-raw-types: true

linter:
  # The lint rules applied to this project can be customized in the section
  # below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional ones. A list of all available
  # lints and their documentation is published at https://dart.dev/lints.
  rules:
    # Style consistency
    prefer_single_quotes: true
    directives_ordering: true

    # Safety / common bug categories — moderate set that large swaths of the
    # codebase already follow. More aggressive rules (prefer_final_locals,
    # require_trailing_commas, prefer_const_constructors) intentionally left
    # OFF for now so that enabling this config doesn't flood `flutter analyze`
    # with hundreds of warnings on existing code; enable them as a follow-up
    # cleanup epic.
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    use_build_context_synchronously: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options